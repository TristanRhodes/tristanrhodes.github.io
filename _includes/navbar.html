<script>
(function () {
    // On touch devices there is no hover: first tap on About opens the
    // dropdown, second tap navigates. Tapping elsewhere closes it.
    if (!window.matchMedia('(hover: none)').matches) return;
    var item = document.querySelector('.nav-bar-item.has-dropdown');
    if (!item) return;
    var link = item.querySelector(':scope > a');
    link.setAttribute('aria-expanded', 'false');
    link.addEventListener('click', function (e) {
        if (item.classList.contains('open')) return; // second tap: navigate
        e.preventDefault();
        item.classList.add('open');
        link.setAttribute('aria-expanded', 'true');
    });
    document.addEventListener('click', function (e) {
        if (item.contains(e.target)) return;
        item.classList.remove('open');
        link.setAttribute('aria-expanded', 'false');
    });
})();
</script>
